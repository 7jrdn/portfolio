<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7jrdn</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://use.typekit.net/bfn7iyg.css">
    <script src="https://kit.fontawesome.com/91d0099d9c.js" crossorigin="anonymous"></script>
</head>

<body style="overflow: hidden">

    <div id="grain">
        <section id="nav">
            <a href="index.html">
                <h1 class="logo"><span class="move">7</span>Jrdn</h1>
            </a>
            <div class="nav-items">
                <a href="about.html">
                    <h2>About</h2>
                </a>
                <a href="contact.html">
                    <h2>Contact</h2>
                </a>
                <div class="social-icons">
                    <a href="https://www.instagram.com/7jrdn" target="_blank"><i class="fa-brands fa-instagram fa-lg"></i></a>
                    <a href="https://www.youtube.com/@7jrdn" target="_blank"><i class="fa-brands fa-youtube fa-lg"></i></a>
                </div>
            </div>
        </section>

        <section id="contact">
            <form action="#" method="POST" class="column" id="contact-form">
                <h1>Send me a message</h1>
                <div class="contact-form">
                    <div class="contact-info">
                        <input type="text" name="name" placeholder="Name" class="contact-input" required>
                        <input type="email" name="email" placeholder="Email" class="contact-input" required>
                    </div>
                    <textarea name="message" placeholder="Message" required></textarea>
                    <button type="submit">Submit</button>
                    <div class="form-message"></div>
                </div>
                
            </form>
        </section>
    </div>


    <script src="grained.js"></script>
    <script>
        var options = {
            animate: true,
            patternWidth: 500,
            patternHeight: 500,
            grainOpacity: 0.03,
            grainDensity: 1,
            grainWidth: 1,
            grainHeight: 1
        };

        grained("#grain", options);
    </script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="contact-form.js"></script>
</body>

</html>
